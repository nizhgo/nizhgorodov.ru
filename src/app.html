<!doctype html>
<html lang="%lang%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="yandex-verification" content="1264ebcd9c36e4ca" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1018" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Person",
				"name": "Алексей Нижгородов",
				"alternateName": "Aleksei Nizhgorodov",
				"url": "https://nizhgorodov.ru",
				"image": "https://nizhgorodov.ru/og-en.png",
				"jobTitle": "Frontend Engineer",
				"email": "alexey@nizhgorodov.ru",
				"knowsLanguage": ["Russian", "English"],
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Moscow",
					"addressCountry": "RU"
				},
				"alumniOf": [
					{ "@type": "CollegeOrUniversity", "name": "HSE University" },
					{ "@type": "CollegeOrUniversity", "name": "NUST MISIS" }
				],
				"sameAs": [
					"https://github.com/nizhgo",
					"https://t.me/nizhgo",
					"https://career.habr.com/nizhgo"
				],
				"knowsAbout": [
					"Frontend",
					"TypeScript",
					"React",
					"Svelte",
					"Leaflet",
					"WebGL",
					"Data visualization",
					"Dashboards"
				]
			}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Onest:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				var t = localStorage.getItem('theme') || 'light';
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
