<!doctype html>
<html lang="%lang%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="yandex-verification" content="1264ebcd9c36e4ca" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1018" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/onest-latin-400-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/onest-cyrillic-400-normal.woff2"
			crossorigin
		/>
		<script>
			(function () {
				var t = localStorage.getItem('theme') || 'light';
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
